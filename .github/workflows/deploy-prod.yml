# Production deploy — preflight (G1/G2) before any rollout steps are added.
# Fleet SSOT: spec/plans/OCI_COMPUTE_FLEET.md + infra/oci/fleet.launch.yaml
# Rolling deploy targets (when wired): app-1, app-2 — linux/arm64 images
# See: .github/OCI_CI_CD.md
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git branch or tag to deploy (when rollout is wired)
        default: main
      component:
        description: Prod component (placeholder until fleet rollout)
        type: choice
        options:
          - preflight_only
          - db_migrate_only
          - backend_only
          - full
        default: preflight_only

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  preflight-repo:
    name: Preflight repo (G1 G2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Repo gates
        run: python scripts/deploy_preflight_repo.py

  preflight-live:
    name: Preflight live DB
    needs: preflight-repo
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install psycopg
        run: pip install "psycopg[binary]==3.2.13"

      - name: Live gates (PgBouncer URL + pg_roles)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: python scripts/deploy_preflight_live.py

  deploy:
    name: Deploy (placeholder)
    needs: [preflight-repo, preflight-live]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          echo "OCI rolling deploy not wired yet — preflight passed."
          echo "Selected component=${{ inputs.component }} ref=${{ inputs.git_ref }}"
